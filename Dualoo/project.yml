name: Dualoo
options:
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
targets:
  Dualoo:
    type: application
    platform: iOS
    sources:
      - path: ios/Dualoo
    resources:
      - path: ios/Dualoo/SeedBundle
      - path: ios/Dualoo/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: test.duckegg.ios
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 
        PROVISIONING_PROFILE_SPECIFIER: ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "duckeggkaifaProfile"
        CODE_SIGN_ENTITLEMENTS: Dualoo.entitlements
        INFOPLIST_FILE: ios/Dualoo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: ios/Dualoo/Info.plist
      properties:
        CFBundleName: Dualoo
        CFBundleDisplayName: Dualoo
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
